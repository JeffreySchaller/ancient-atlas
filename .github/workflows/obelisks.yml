name: Obelisks layer
on:
  pull_request:
    paths:
      - 'data/obelisks.json'
      - 'public/data/obelisks.json'
      - 'public/assets/obelisks/**'
      - 'public/obelisks/**'
      - 'public/lidar.html'
      - 'public/follow-the-water.html'
      - 'public/assets/social/**'
      - 'public/assets/js/open-map-share.js'
      - 'scripts/build-map-share-pages.py'
      - 'scripts/render-obelisk-cards.cjs'
      - 'public/assets/obelisks.css'
      - 'public/assets/js/atlas-obelisks.js'
      - 'scripts/verify-obelisks.py'
      - 'scripts/build.py'
      - '.github/workflows/obelisks.yml'
jobs:
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/verify-obelisks.py
      - run: node --check public/assets/js/atlas-obelisks.js
      - run: node --check public/assets/js/open-map-share.js
      - run: python3 scripts/build-map-share-pages.py --check
